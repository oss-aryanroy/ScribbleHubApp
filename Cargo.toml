[package]
name = "scribblehub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui = "0.2.2"
image = "0.25"
http_client = { version = "0.2.2", package = "gpui_http_client" }
scraper = "0.29.0"
serde_json = "1.0.154"
ureq = "3"
wry = "0.57"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
